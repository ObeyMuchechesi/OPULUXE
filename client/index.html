<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>OPULUXE BEAUTY STUDIO — Your Beauty Elevated | Braids & Styling in Lusaka</title>
    <meta
      name="description"
      content="OPULUXE BEAUTY STUDIO — Lusaka's home of crown care. Book knotless braids, twists, cornrows, silk press and hair treatments online. Open Mon–Sat, 07:00–20:00."
    />
    <meta name="theme-color" content="#0B0A08" />

    <!-- Canonical + indexing -->
    <link rel="canonical" href="https://opuluxe-iota.vercel.app/" />
    <meta name="robots" content="index, follow" />

    <!-- Favicon / device icons -->
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, WhatsApp, LinkedIn, Discord...) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="OPULUXE BEAUTY STUDIO" />
    <meta property="og:title" content="OPULUXE BEAUTY STUDIO — Your Beauty Elevated" />
    <meta
      property="og:description"
      content="Book knotless braids, twists, cornrows and premium hair care online. Lusaka's home of crown care."
    />
    <meta property="og:url" content="https://opuluxe-iota.vercel.app/" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="OPULUXE BEAUTY STUDIO — Your Beauty Elevated" />
    <meta property="og:locale" content="en_ZM" />

    <!-- Twitter/X card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OPULUXE BEAUTY STUDIO — Your Beauty Elevated" />
    <meta
      name="twitter:description"
      content="Book knotless braids, twists, cornrows and premium hair care online. Lusaka's home of crown care."
    />
    <meta name="twitter:image" content="https://opuluxe-iota.vercel.app/og-image.jpg" />

    <!-- Structured data: LocalBusiness + booking actions -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "OPULUXE BEAUTY STUDIO",
        "slogan": "Your Beauty Elevated",
        "url": "https://opuluxe-iota.vercel.app/",
        "image": "https://opuluxe-iota.vercel.app/og-image.jpg",
        "logo": "https://opuluxe-iota.vercel.app/logo.png",
        "description": "Boutique beauty studio in Lusaka specialising in knotless braids, twists, cornrows, silk press and premium hair care.",
        "telephone": "+260970000000",
        "priceRange": "K100 - K1000",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Plot 12, Great East Road",
          "addressLocality": "Lusaka",
          "addressCountry": "ZM"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "07:00",
            "closes": "20:00"
          }
        ],
        "potentialAction": {
          "@type": "ReserveAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://opuluxe-iota.vercel.app/book",
            "inLanguage": "en",
            "actionPlatform": [
              "http://schema.org/DesktopWebPlatform",
              "http://schema.org/MobileWebPlatform"
            ]
          },
          "result": { "@type": "Reservation", "name": "Appointment booking" }
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
